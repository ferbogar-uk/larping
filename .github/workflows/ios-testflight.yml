name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload signed IPA to App Store Connect'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-ios:
    name: Build signed iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      TEAM_ID: Z6HU7P866U
      BUNDLE_ID: rdyy.larping
      PROFILE_NAME: Larping App Store Distribution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          test -n "$P12"
          test -n "$PASSWORD"
          test -n "$PROFILE"

      - name: Install signing certificate
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain

          # Convert the original P12 to a macOS-compatible legacy PKCS#12.
          # The certificate and key remain the same; only the wrapping format changes.
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          trap 'rm -f "$RUNNER_TEMP/signing.pem"' EXIT

          "$OPENSSL" pkcs12 \
            -in "$RUNNER_TEMP/cert.p12" \
            -passin env:PASSWORD \
            -nodes \
            -out "$RUNNER_TEMP/signing.pem"

          "$OPENSSL" pkcs12 -export \
            -in "$RUNNER_TEMP/signing.pem" \
            -out "$RUNNER_TEMP/cert-legacy.p12" \
            -passout env:PASSWORD \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1

          rm -f "$RUNNER_TEMP/signing.pem"

          security import "$RUNNER_TEMP/cert-legacy.p12" \
            -k build.keychain \
            -P "$PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "" build.keychain

          security list-keychains -d user \
            -s build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/larping.mobileprovision"

          security find-identity -v -p codesigning build.keychain

      - name: Archive iOS app
        run: |
          set -o pipefail

          xcodebuild archive \
            -project larping.xcodeproj \
            -scheme larping \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Larping.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF_OPTIONS
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF_OPTIONS

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Larping.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larping-iOS-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA to TestFlight
        if: ${{ inputs.upload_to_testflight == true }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$ASC_KEY_ID" || { echo "::error::Missing Key ID"; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::Missing Issuer ID"; exit 1; }
          test -n "$ASC_API_KEY" || { echo "::error::Missing API Key"; exit 1; }

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$ASC_API_KEY" > "$KEY_FILE"

          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY_FILE" || {
            echo "::error::API key must contain the raw .p8 private key"
            exit 1
          }
          shopt -s nullglob
          IPAS=("$RUNNER_TEMP"/export/*.ipa)
          test "${#IPAS[@]}" -eq 1

          xcrun altool --upload-app \
            --type ios \
            --file "${IPAS[0]}" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
            
      - name: Clean signing files
        if: always()
        run: |
        
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -f "$RUNNER_TEMP/cert-legacy.p12"
          rm -f "$RUNNER_TEMP/signing.pem"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/larping.mobileprovision"
